# ============================================================
#  Akamai SIEM Event Collector — Configuration
# ============================================================
#  Edit the values in [collection] and [credentials] before
#  running collector.py for the first time.
#
#  Run manually:
#      python collector.py
#      python collector.py --config siem_collector.conf --debug
# ============================================================

[collection]
# Comma-separated list of Akamai SIEM configuration IDs to collect.
# Find your config IDs in Akamai Security Center or via the AppSec API.
# Example: config_ids = 12345
# Example: config_ids = 12345, 67890, 11111
config_ids = 80955, 80020
# How many hours back to collect on each run.
# Use 25 instead of 24 to ensure a 1-hour overlap and avoid gaps
# if the previous run finished a few minutes late.
#hours_back = 24
hours_back = 1


# Akamai API page size. 10000 is a safe default.
# The API accepts up to 600000 but large pages increase memory use.
limit = 100000

[storage]
# Folder where .jsonl.gz files are saved (relative to this config file).
# The folder is created automatically if it does not exist.
output_dir = SIEM events

# How many days to keep archived files before deleting them (0 = keep forever).
retention_days = 60

[credentials]
# Path to the Akamai .edgerc credentials file.
# The default below points one level up — to the 'report script' folder
# where edgerc.txt lives alongside the original proxy script.
edgerc = ../edgerc.txt

# Section name inside .edgerc that holds the SIEM API credentials.
siem_section = SIEM

# Section name inside .edgerc used to call the AppSec API (/appsec/v1/configs)
# for resolving configuration names. This is used once when report_info.txt is
# first created. If this section does not exist in .edgerc, config names will
# fall back to "Config <id>" and collection will still work normally.
config_section = config
